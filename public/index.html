<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Blood & Control</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #0a0a0c;
      --panel: #121218;
      --accent: #c41e3a;
      --text: #e8e6e3;
      --muted: #8a8680;
      --border: #2a2a32;
      --makima: #e8b4b8;
      --player: #b8d4e8;
      --action: #c9c4b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100%; max-width: 920px; margin: 0 auto; }

    .header { padding: 12px 16px; text-align: center; border-bottom: 1px solid var(--border); background: linear-gradient(180deg,#16161e,var(--bg)); }
    .logo { font-size: 1.15rem; font-weight: 700; letter-spacing: 3px; color: var(--accent); }
    .subtitle { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }

    /* Lobby */
    #lobby { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; gap: 18px; }
    #lobby input, #lobby select { width: 100%; max-width: 320px; padding: 12px 14px; background: #0e0e14; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1rem; }
    #lobby button { width: 100%; max-width: 320px; padding: 13px; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; }
    .primary { background: var(--accent); color: white; }
    .secondary { background: #1e1e28; color: var(--text); border: 1px solid var(--border) !important; }
    .lobby-title { font-size: 1.3rem; margin-bottom: 8px; }
    .lobby-hint { color: var(--muted); font-size: 0.85rem; text-align: center; max-width: 320px; }

    /* Game */
    #game { display: none; flex-direction: column; height: 100%; }
    .stage { flex: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; }
    .scene-bg { position: absolute; inset: 0; background: url('/assets/farm-start.png') center/cover no-repeat; opacity: 0.42; z-index: 0; }
    .scene-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(10,10,12,0.25) 0%, rgba(10,10,12,0.82) 65%, var(--bg) 100%); }

    .characters { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: flex-end; padding: 10px 14px 0; height: 36%; min-height: 150px; }
    .char { display: flex; flex-direction: column; align-items: center; width: 43%; }
    .char img { max-height: 100%; max-width: 100%; object-fit: contain; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.55)); }
    .char-name { margin-top: 5px; font-size: 0.78rem; font-weight: 600; background: rgba(0,0,0,0.65); padding: 3px 9px; border-radius: 4px; }

    .narrative { position: relative; z-index: 3; flex: 1; overflow-y: auto; padding: 12px 14px; background: rgba(10,10,14,0.78); border-top: 1px solid var(--border); font-size: 0.92rem; line-height: 1.5; }
    .narrative p { margin-bottom: 10px; }
    .narrative .system { color: var(--muted); font-style: italic; font-size: 0.8rem; }
    .narrative .makima { color: var(--makima); border-left: 3px solid #8a3a4a; padding-left: 10px; }
    .narrative .player { color: var(--player); border-left: 3px solid #3a5a8a; padding-left: 10px; }
    .narrative .action { color: var(--action); font-style: italic; }

    .input-area { background: var(--panel); border-top: 1px solid var(--border); padding: 10px 12px 12px; }
    .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; color: var(--muted); margin-bottom: 7px; gap: 8px; }
    .room-code { background: #1a1a22; padding: 2px 8px; border-radius: 4px; letter-spacing: 1px; }
    textarea { width: 100%; background: #0e0e14; border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 0.95rem; resize: none; outline: none; font-family: inherit; }
    textarea:focus { border-color: #5a3a42; }
    .buttons { display: flex; gap: 8px; margin-top: 9px; }
    button { flex: 1; padding: 11px 8px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
    #sendBtn { background: var(--accent); color: white; }
    #sendBtn:active { background: #a01830; }

    @media (max-width: 600px) {
      .characters { height: 32%; min-height: 130px; }
      .narrative { font-size: 0.87rem; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- LOBBY -->
    <div id="lobby">
      <div class="logo">BLOOD & CONTROL</div>
      <div class="subtitle">Chainsaw Man × Kingdom</div>
      <div class="lobby-title" style="margin-top:18px">Вход в комнату</div>
      
      <input id="nameInput" placeholder="Твоё имя (Арата Люцифуг)" value="Арата Люцифуг" />
      <select id="roleSelect">
        <option value="player">Я — Игрок (Генерал)</option>
        <option value="makima">Я — Макима</option>
      </select>
      <input id="roomInput" placeholder="Код комнаты (если есть)" />
      
      <button class="primary" id="joinBtn">Войти / Создать комнату</button>
      <div class="lobby-hint">Если оставить код пустым — создастся новая комната. Потом просто скинь код второму участнику.</div>
    </div>

    <!-- GAME -->
    <div id="game">
      <header class="header">
        <div class="logo">BLOOD & CONTROL</div>
        <div class="subtitle">Chainsaw Man × Kingdom</div>
      </header>

      <main class="stage">
        <div class="scene-bg"></div>
        <div class="characters">
          <div class="char">
            <img src="/assets/general-free.png" alt="Генерал" />
            <div class="char-name" id="playerLabel">Арата Люцифуг</div>
          </div>
          <div class="char">
            <img src="/assets/makima.png" alt="Макима" />
            <div class="char-name">Макима</div>
          </div>
        </div>
        <div class="narrative" id="narrative"></div>
      </main>

      <footer class="input-area">
        <div class="status-bar">
          <span>Комната: <span class="room-code" id="roomCodeDisplay">—</span></span>
          <span id="roleDisplay">—</span>
        </div>
        <textarea id="msgInput" placeholder="Напиши действие или реплику..." rows="2"></textarea>
        <div class="buttons">
          <button id="sendBtn">Отправить</button>
        </div>
      </footer>
    </div>
  </div>

  <script>
    const socket = io();
    let myRole = 'player';
    let currentRoom = null;

    const lobby = document.getElementById('lobby');
    const game = document.getElementById('game');
    const narrative = document.getElementById('narrative');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const joinBtn = document.getElementById('joinBtn');
    const nameInput = document.getElementById('nameInput');
    const roleSelect = document.getElementById('roleSelect');
    const roomInput = document.getElementById('roomInput');
    const roomCodeDisplay = document.getElementById('roomCodeDisplay');
    const roleDisplay = document.getElementById('roleDisplay');
    const playerLabel = document.getElementById('playerLabel');

    function addEntry(entry) {
      const p = document.createElement('p');
      p.className = entry.type || 'action';
      p.innerHTML = (entry.text || '').replace(/\\n/g, '<br>');
      narrative.appendChild(p);
      narrative.scrollTop = narrative.scrollHeight;
    }

    function showGame(roomId, role, name) {
      lobby.style.display = 'none';
      game.style.display = 'flex';
      currentRoom = roomId;
      myRole = role;
      roomCodeDisplay.textContent = roomId;
      roleDisplay.textContent = role === 'makima' ? 'Ты — Макима' : 'Ты — Игрок';
      if (role === 'player') playerLabel.textContent = name;
    }

    joinBtn.addEventListener('click', () => {
      const name = nameInput.value.trim() || 'Игрок';
      const role = roleSelect.value;
      const roomCode = roomInput.value.trim();

      if (!roomCode) {
        // Create new room
        socket.emit('create-room', (res) => {
          if (res.roomId) {
            socket.emit('join-room', { roomId: res.roomId, name, role }, (data) => {
              if (data.error) return alert(data.error);
              showGame(data.roomId, role, name);
              // Initial scene only for the creator (first one)
              if (data.history.length === 0) {
                const intro = [
                  { type: 'system', text: '— Ферма на окраине. Сумерки. —' },
                  { type: 'action', text: 'Кусок древней каменной гробницы врезался в землю посреди поля. Трещины ещё дымят слабым синим свечением.' },
                  { type: 'action', text: 'Ты стоишь среди обломков. Цепи, что держали тебя целый век, лежат разорванными у ног.' },
                  { type: 'system', text: 'Вдалеке слышен звук приближающегося автомобиля.' },
                  { type: 'makima', text: 'Макима (тихо): «Странный сигнал… и совсем не похож на обычного демона.»' },
                  { type: 'action', text: 'Чёрный автомобиль останавливается. Из него выходит женщина в строгом костюме. Рыжие волосы, жёлтые глаза, спокойная улыбка.' },
                  { type: 'makima', text: 'Макима смотрит на тебя:\\n— Ты не местный. И сила у тебя… необычная. Как тебя зовут?' }
                ];
                intro.forEach(e => {
                  socket.emit('send-message', e);
                });
              } else {
                data.history.forEach(addEntry);
              }
            });
          }
        });
      } else {
        socket.emit('join-room', { roomId: roomCode, name, role }, (data) => {
          if (data.error) return alert(data.error);
          showGame(data.roomId, role, name);
          data.history.forEach(addEntry);
        });
      }
    });

    sendBtn.addEventListener('click', () => {
      const text = msgInput.value.trim();
      if (!text || !currentRoom) return;

      const type = myRole === 'makima' ? 'makima' : 'player';
      const finalText = myRole === 'makima' ? text : `Ты: ${text}`;

      socket.emit('send-message', { type, text: finalText });
      msgInput.value = '';
      msgInput.focus();
    });

    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
      }
    });

    socket.on('new-message', (entry) => {
      addEntry(entry);
    });

    socket.on('player-joined', (p) => {
      addEntry({ type: 'system', text: `${p.name} (${p.role === 'makima' ? 'Макима' : 'Игрок'}) присоединился к комнате.` });
    });

    socket.on('player-left', (p) => {
      addEntry({ type: 'system', text: `${p.name} покинул комнату.` });
    });
  </script>
</body>
</html>
